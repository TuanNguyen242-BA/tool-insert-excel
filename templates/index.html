<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOCX Template Builder Web</title>
  <style>
    :root { font-family: "Times New Roman", Times, serif; color: #1f2933; background: #f5f7fa; }
    body { margin: 0; }
    main { max-width: 980px; margin: 0 auto; padding: 28px; }
    h1 { font-size: 24px; margin: 0 0 18px; }
    section { background: white; border: 1px solid #d9e2ec; border-radius: 8px; padding: 22px; }
    label { display: block; font-weight: 600; margin: 16px 0 6px; }
    input[type=file] { width: 100%; padding: 10px; border: 1px solid #bcccdc; border-radius: 6px; background: #fff; }
    button { margin-top: 22px; padding: 10px 16px; border: 0; border-radius: 6px; background: #0f609b; color: white; font-weight: 700; cursor: pointer; }
    .hint { color: #52606d; font-size: 14px; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>DOCX Template Builder Web</h1>
    <section>
      <form action="/configure" method="post" enctype="multipart/form-data">
        <label>File Word template (.docx)</label>
        <input type="file" name="docx_file" accept=".docx" required>

        <label>File Excel dữ liệu (.xlsx/.xlsm)</label>
        <input type="file" name="excel_file" accept=".xlsx,.xlsm" required>

        <p class="hint">
          Bản web dùng luồng 7 bước: xác định phần mở đầu, kiểm tra defaults/sections,
          chỉnh heading, chọn nội dung giữ/xoá/chèn theo từng heading, rồi tải DOCX đã generate.
        </p>
        <button type="submit">Phân tích file</button>
      </form>
    </section>
  </main>
</body>
</html>
