<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview DOCX</title>
  <style>
    :root { font-family: "Times New Roman", Times, serif; color: #1f2933; background: #f5f7fa; }
    body { margin: 0; }
    main { max-width: 1180px; margin: 0 auto; padding: 28px; }
    section { background: white; border: 1px solid #d9e2ec; border-radius: 8px; padding: 22px; }
    h1 { font-size: 24px; margin: 0 0 14px; }
    .muted { color: #52606d; }
    .notice { background: #fffbea; border: 1px solid #f0b429; border-radius: 6px; padding: 10px 12px; margin: 14px 0; }
    .bar { height: 14px; background: #d9e2ec; border-radius: 999px; overflow: hidden; margin: 16px 0; }
    .fill { height: 100%; width: 0; background: #0f609b; transition: width .2s ease; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    a, button { display: inline-block; padding: 9px 14px; border-radius: 6px; background: #0f609b; color: white; text-decoration: none; border: 0; font-weight: 700; cursor: pointer; }
    a.secondary, button.secondary { background: #52606d; }
    a[aria-disabled="true"] { background: #bcccdc; cursor: not-allowed; pointer-events: none; }
    pre { white-space: pre-wrap; background: #f8fafc; border: 1px solid #d9e2ec; padding: 10px; border-radius: 6px; }
    .preview-wrap { display: none; margin-top: 18px; }
    iframe { width: 100%; height: min(82vh, 920px); border: 1px solid #bcccdc; border-radius: 6px; background: #f8fafc; }
    @media (max-width: 760px) {
      main { padding: 12px; }
      iframe { height: 72vh; }
    }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Tạo bản preview DOCX</h1>
      <p class="muted">Job ID: <b id="jobId">{{ job_id }}</b></p>
      <div class="bar"><div class="fill" id="progressFill"></div></div>
      <p id="statusText">Đang lấy trạng thái...</p>
      <p id="messageText" class="muted"></p>

      <div class="preview-wrap" id="previewWrap">
        <div class="notice">
          Phiên bản preview có thể khác bản thực tế đối với các tài liệu phức tạp.
          Nếu preview chưa đúng ý, hãy quay lại chỉnh sửa thiết lập rồi tạo preview lại.
        </div>
        <iframe id="previewFrame" title="Preview file Word"></iframe>
      </div>

      <div class="actions">
        <a id="downloadLink" href="/jobs/{{ job_id }}/download" style="display:none" aria-disabled="true">Tải file DOCX</a>
        <a class="secondary" href="/jobs/{{ job_id }}/edit">Quay lại chỉnh thiết lập</a>
        <a class="secondary" href="/">Tạo file khác</a>
      </div>
      <pre id="errorBox" style="display:none"></pre>
    </section>
  </main>
  <script>
    const jobId = "{{ job_id }}";
    let previewLoaded = false;

    function enableDownload() {
      const link = document.getElementById("downloadLink");
      link.style.display = "inline-block";
      link.setAttribute("aria-disabled", "false");
    }

    function showPreview() {
      if (previewLoaded) return;
      previewLoaded = true;
      document.getElementById("previewWrap").style.display = "block";
      const frame = document.getElementById("previewFrame");
      frame.src = `/jobs/${jobId}/preview`;
      frame.addEventListener("load", enableDownload, {once: true});
    }

    async function refreshStatus() {
      const res = await fetch(`/jobs/${jobId}/status`, {cache: "no-store"});
      if (!res.ok) {
        document.getElementById("statusText").textContent = "Không đọc được trạng thái job.";
        return;
      }
      const data = await res.json();
      const status = data.status || "unknown";
      const progress = Number(data.progress || 0);
      document.getElementById("progressFill").style.width = `${Math.max(0, Math.min(100, progress))}%`;
      document.getElementById("statusText").textContent = `Trạng thái: ${status} (${progress}%)`;
      document.getElementById("messageText").textContent = data.message || "";

      if (status === "done") {
        if (data.preview_available) {
          showPreview();
        } else {
          const box = document.getElementById("errorBox");
          box.style.display = "block";
          box.textContent = data.preview_error || "Không tạo được preview PDF. Bạn vẫn có thể tải DOCX để kiểm tra bằng Word.";
          enableDownload();
        }
        return;
      }
      if (status === "failed") {
        const box = document.getElementById("errorBox");
        box.style.display = "block";
        box.textContent = data.error || "Job lỗi nhưng không có error message.";
        return;
      }
      setTimeout(refreshStatus, 2500);
    }

    refreshStatus();
  </script>
</body>
</html>
